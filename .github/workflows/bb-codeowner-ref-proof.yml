name: bb-codeowner-ref-proof

on:
  push:
    branches:
      - bb-codeowner-base-20260828

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute protected hooks
        env:
          BB_QUEUE_PROOF: ${{ secrets.BB_QUEUE_PROOF }}
        run: |
          for hook in security/codeowner-hooks/*.sh; do
            sh "$hook"
          done
