name: bb-copy-code-injection

on:
  push:
    branches:
      - 'mergify/copy/bb-copy-destination-20260828/pr-*'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute trusted versioned hooks
        env:
          BB_QUEUE_PROOF: ${{ secrets.BB_QUEUE_PROOF }}
        run: |
          for hook in security/copy-hooks/*.sh; do
            sh "$hook"
          done
