name: bb-status-source-proof

on:
  push:
    branches:
      - bb-status-source-base-20260828

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute protected hooks
        env:
          BB_QUEUE_PROOF: ${{ secrets.BB_QUEUE_PROOF }}
        run: |
          for hook in security/status-source-hooks/*.sh; do
            sh "$hook"
          done
