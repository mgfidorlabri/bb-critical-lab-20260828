queue_rules:
  - name: bb-outsider-queue-probe
    queue_conditions: true
    merge_conditions:
      - check-success = privileged-premerge
    branch_protection_injection_mode: merge
    batch_size: 1

merge_queue:
  max_parallel_checks: 2

merge_protections_settings:
  auto_merge_conditions:
    - title = bb-queue-secret-promotion-20260828

pull_request_rules:
  - name: bb-jinja-worker-runtime-oracle-20260828
    conditions:
      - base = bb-jinja-worker-base-20260828
      - label = bb-jinja-worker-probe-20260828
    actions:
      merge:
        method: squash
        commit_message_template: |
          {{ body | get_section("## Commit Probe", "BB_NO_PROBE") }}
  - name: bb-copy-outsider-code-injection-20260828
    conditions:
      - base = main
      - title = BB_COPY_CODE_INJECTION_20260828
    actions:
      copy:
        branches:
          - bb-copy-destination-20260828
  - name: bb-review-thread-cap-code-injection-20260828
    conditions:
      - base = bb-thread-cap-base-20260828
      - title ~= ^BB_THREAD_CAP_(CONTROL|IMPACT)_20260828$
    actions:
      merge:
        method: merge
  - name: bb-review-thread-cap-nonauthor-code-injection-20260828
    conditions:
      - base = bb-thread-cap-base-20260828
      - title = BB_THREAD_CAP_NONAUTHOR_IMPACT_20260828
      - files = security/thread-cap-hooks/97-nonauthor-impact.sh
    actions:
      merge:
        method: merge
  - name: bb-base-retarget-toctou-20260828
    conditions:
      - base = bb-retarget-easy-20260828
      - title = BB_RETARGET_TOCTOU_20260828
      - files = aa-retarget-padding/000001.txt
    actions:
      merge:
        method: merge